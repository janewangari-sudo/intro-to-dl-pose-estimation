# Paths are resolved relative to the repository root.
data:
  dir: coco
  download: true
  input_size: [256, 192]
  heatmap_size: [64, 48]
  sigma: 2.0
  train_fraction: 0.85
  split_seed: 42
  min_image_keypoints: 5
  min_annotation_keypoints: 1

loader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  num_joints: 17
  pretrained: true

training:
  epochs: 30
  head_learning_rate: 0.001
  backbone_learning_rate: 0.0001
  # Zero-based: 5 unfreezes the backbone before epoch 6.
  unfreeze_epoch: 5
  scheduler_step_size: 20
  scheduler_gamma: 0.1
  mixed_precision: true
  channels_last: true

evaluation:
  pck_threshold: 0.2
  visibility_threshold: 0.01

visualization:
  num_samples: 6
  seed: 7
  confidence_threshold: 0.1

output:
  dir: outputs
  results_dir: outputs/results
  figures_dir: outputs/figures
  weights: simplebaseline_weights.pth
  config_copy: run_config.yaml
  history: training_history.json
  loss_curves: loss_curves_simplebaseline.png
  pck_results: pck_results.json
  pck_chart: per_joint_pck_simplebaseline.png
  pck_comparison: pck_comparison.json
  pck_comparison_plot: pck_comparison.png
  per_joint_comparison_plot: per_joint_pck.png
  coco_predictions: simplebaseline_coco_results.json
  coco_metrics: simplebaseline_coco_ap.json
  predictions: prediction_examples.png
